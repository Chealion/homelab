apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickstack-operators
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "150"
    argocd.argoproj.io/compare-options: ServerSideDiff=true # https://github.com/argoproj/argo-cd/issues/19038
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: clickstack-operators
      repoURL: https://clickhouse.github.io/ClickStack-helm-charts
      targetRevision: 1.0.0
      helm:
        releaseName: clickstack-operators
        valueFiles:
          - $values/argocd/values/clickstack-operators.yaml
    - repoURL: https://github.com/chealion/homelab
      targetRevision: main
      ref: values
  destination:
    name: in-cluster
    namespace: clickstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
