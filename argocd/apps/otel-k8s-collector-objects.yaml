apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-k8s-collector-objects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "140"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/chealion/homelab
      targetRevision: main
      path: argocd/objects/otel-k8s-collector/
  destination:
    name: in-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
