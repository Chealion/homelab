apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-k8s-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "150"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - chart: opentelemetry-collector
      repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      targetRevision: 0.165.0
      helm:
        releaseName: otel-k8s-collector
        valueFiles:
          - $values/argocd/values/otel-k8s-collector.yaml
    - repoURL: https://github.com/chealion/homelab
      targetRevision: main
      ref: values
  destination:
    name: in-cluster
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
