---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nodeipamlb-gateway-class
spec:
  controllerName: io.cilium/gateway-controller
  description: Non default gateway class for node ipam lb services
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: nodeipamlb-gateway-config
    namespace: default
---
apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: nodeipamlb-gateway-config
  namespace: default
spec:
  service:
    loadBalancerClass: io.cilium/node
  telemetry:
    accessLogs:
      - format: JSON
      # Default format - https://github.com/cilium/cilium/blob/v1.20.1/pkg/k8s/apis/cilium.io/v2alpha1/gatewayclassconfig_types.go#L190
