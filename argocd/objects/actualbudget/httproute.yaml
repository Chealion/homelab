---
# The chart has no Gateway API support; it renders an Ingress instead (kept inert in values).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actualbudget-route
  namespace: actualbudget
spec:
  hostnames:
    - budget.k8s.notsodefault.ca
  parentRefs:
    - name: l2-gateway
      sectionName: actualbudget-listener
      namespace: kube-system
  rules:
    - backendRefs:
        - name: actualbudget
          port: 5006
      matches:
        - path:
            type: PathPrefix
            value: /
