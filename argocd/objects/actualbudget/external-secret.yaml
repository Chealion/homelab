---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actualbudget-oidc
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: actualbudget-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: oidc-actualbudget/client-id
    - secretKey: client-secret
      remoteRef:
        key: oidc-actualbudget/client-secret
