---
# Templates DB_URL for HA's recorder (env.DB_URL in argocd/values/homeassistant.yaml).
# Composed from the same 1Password item as homeassistant-db-user (#167).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-recorder-url
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: homeassistant-recorder-url
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_URL: "postgresql://{{ .username }}:{{ .password }}@homeassistant-db-cluster-rw.homeassistant.svc:5432/homeassistant"
  data:
    - secretKey: username
      remoteRef:
        key: homeassistant-db-user/username
    - secretKey: password
      remoteRef:
        key: homeassistant-db-user/password
---
# Long-lived access token for the Prometheus scrape (#156).
# HITL: create the token in HA UI (Profile → Long-Lived Access Tokens) post-install (#171),
# store it as the homeassistant/prometheus-token item in 1Password. Syncs once the item exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-prometheus-token
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: homeassistant-prometheus-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: homeassistant/prometheus-token
