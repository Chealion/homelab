---
apiVersion: v1
kind: Namespace
metadata:
  name: homeassistant
  labels:
    shared-gateway-access: "true"
    # hostNetwork: true (#158) is blocked by the baseline Pod Security Standard.
    # The namespace must enforce: privileged to admit the HA pod. Mirrors the
    # monitoring namespace (argocd/objects/kube-prometheus-stack/namespace.yaml).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
