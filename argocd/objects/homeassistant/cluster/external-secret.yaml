---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-db-user
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: 1password-sdk
  target:
    name: homeassistant-db-user
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: homeassistant-db-user/username
    - secretKey: password
      remoteRef:
        key: homeassistant-db-user/password
