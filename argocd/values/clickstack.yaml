# Values for clickstack

# Define dummy secret keys so the Helm chart successfully compiles its internal templates.
# The actual keys inside the resulting `clickstack-secret` will be safely merged
# and overwritten at runtime by the ExternalSecrets operator from 1Password.
hyperdx:
  config:
    FRONTEND_URL: "https://clickstack.k8s.notsodefault.ca"
  secrets:
    HYPERDX_API_KEY: "dummy-api-key-do-not-change"
    CLICKHOUSE_PASSWORD: "dummy-clickhouse-password-do-not-change"
    CLICKHOUSE_APP_PASSWORD: "dummy-clickhouse-app-password-do-not-change"
    MONGODB_PASSWORD: "dummy-mongodb-password-do-not-change"
  deployment:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

clickhouse:
  enabled: true
  keeper:
    spec:
      replicas: 3
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
      # Keeper requires AVX3. The Intel Mac mini from 2012 only has AVX2.
      podTemplate:
        securityContext: {}
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - mini2012
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: clickhouse.com/role
                        operator: In
                        values:
                          - clickhouse-keeper
                  topologyKey: kubernetes.io/hostname
        initContainers:
          - name: fix-permissions
            image: busybox:stable
            command: ["sh", "-c", "mkdir -p /mnt/data/var-lib-clickhouse /mnt/data/var-log-clickhouse && chown -R 101:101 /mnt/data"]
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: clickhouse-storage-volume
                mountPath: /mnt/data
      containerTemplate:
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - SETGID
              - SETUID
  cluster:
    spec:
      podTemplate:
        securityContext: {}
        initContainers:
          - name: fix-permissions
            image: busybox:stable
            command: ["sh", "-c", "mkdir -p /mnt/data/var-lib-clickhouse /mnt/data/var-log-clickhouse && chown -R 101:101 /mnt/data"]
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: clickhouse-storage-volume
                mountPath: /mnt/data
      containerTemplate:
        image:
          repository: clickhouse/clickhouse-server
          tag: "25.7-alpine"
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            # Needs to match max_server_memory_usage in settings.extraConfig below
            memory: 4Gi
        # Inject passwords as environment variables from the ExternalSecret `clickstack-secret`
        env:
          - name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickstack-secret
                key: CLICKHOUSE_PASSWORD
          - name: CLICKHOUSE_APP_PASSWORD
            valueFrom:
              secretKeyRef:
                name: clickstack-secret
                key: CLICKHOUSE_APP_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - SETGID
              - SETUID
      replicas: 1
      shards: 1
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            # Local path isn't going to actually respect this but 75ish is what we expect
            storage: 75Gi
      # Configure ClickHouse to read passwords securely from the environment using @from_env
      settings:
        extraConfig:
          # Very loosely based on https://kb.altinity.com/altinity-kb-setup-and-maintenance/configure_clickhouse_for_low_mem_envs/
          keep_alive_timeout: 64
          max_thread_pool_size: 2000
          max_connections: 1024
          max_concurrent_queries: 16
          max_server_memory_usage: 4294967296 # 4Gi in bytes
          background_pool_size: 2
          background_merges_mutations_concurrency_ratio: 2
          merge_tree:
            merge_max_block_size: 1024
            max_bytes_to_merge_at_max_space_in_pool: 1073741824
            number_of_free_entries_in_pool_to_lower_max_size_of_merge: 2
            number_of_free_entries_in_pool_to_execute_mutation: 2
            number_of_free_entries_in_pool_to_execute_optimize_entire_partition: 2
            min_bytes_for_wide_part: 134217728
            vertical_merge_algorithm_min_bytes_to_activate: 134217728
          mark_cache_size: 2147483648 # 2Gi
          index_mark_cache_size: 2147483648 # 2Gi
          uncompressed_mark_cache_size: 1073741824 # 1Gi
          storage_configuration:
            disks:
              default:
                keep_free_space_bytes: 536870912
        extraUsersConfig:
          users:
            app:
              password:
                - "@from_env": CLICKHOUSE_APP_PASSWORD
              profile: default
              grants:
                - query: "GRANT SHOW ON *.*, SELECT ON system.*, SELECT ON default.*"
            otelcollector:
              password:
                - "@from_env": CLICKHOUSE_PASSWORD
              profile: default
              grants:
                - query: "GRANT SELECT,INSERT,CREATE,SHOW ON default.*"

mongodb:
  enabled: true
  spec:
    members: 1
    type: ReplicaSet
    version: "5.0.32"
    # MongoDB Operator requires both data-volume and logs-volume claim templates to be defined
    # to apply storageClass overrides successfully to all persistent volumes.
    statefulSet:
      spec:
        volumeClaimTemplates:
          - metadata:
              name: data-volume
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: local-path
              resources:
                requests:
                  storage: 4Gi
          - metadata:
              name: logs-volume
            spec:
              accessModes:
                - ReadWriteOnce
              storageClassName: local-path
              resources:
                requests:
                  storage: 2Gi

otel-collector:
  enabled: true
  config:
    exporters:
      clickhouse:
        ttl: 1080h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
